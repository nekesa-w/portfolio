<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NW's Portfolio</title>
        <link rel="icon" type="image" href="images/logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: {
                            inter: ["Inter", "sans-serif"],
                        },
                    },
                },
            };
        </script>
    </head>

    <body class="font-inter relative bg-white">
        <div
            id="parallax"
            class="pointer-events-none fixed left-0 top-0 z-20 flex h-full w-full items-center justify-center overflow-hidden"
        >
            <div
                class="parallax-plus absolute bottom-6 left-1/2 -translate-x-1/2"
            >
                <span class="text-6xl font-black text-black">+</span>
            </div>

            <div
                class="parallax-layer flex h-[90vh] w-[90vw] flex-col items-center justify-center space-y-4 rounded-[10px] bg-black will-change-transform"
                data-speed="0.6"
            >
                <h1 class="text-center text-6xl font-black text-neutral-500">
                    FRONT-END DEVELOPER
                </h1>
                <h1 class="text-center text-8xl font-black text-white">
                    NICOLE WASIKE
                    <span
                        class="inline-block h-6 w-6 bg-white align-baseline"
                    ></span>
                </h1>
                <h1 class="text-center text-7xl font-black text-neutral-500">
                    UI/UX DESIGNER
                </h1>
                <p class="absolute bottom-12 left-24 text-3xl text-white">
                    Nairobi, Kenya
                </p>
                <p class="absolute bottom-12 right-24 text-3xl text-white">
                    <script>
                        document.write(new Date().getFullYear());
                    </script>
                </p>
            </div>
        </div>

        <main
            id="mainContent"
            class="relative z-10 flex h-screen snap-x snap-mandatory flex-nowrap overflow-x-auto overflow-y-hidden"
        >
            <section
                id="home"
                class="flex h-screen w-screen flex-shrink-0 snap-start items-center justify-center"
            >
                <h1 class="px-[5vw] text-8xl font-thin">
                    <span class="font-thin italic">Nairobi</span>
                    -Based
                    <span
                        class="inline-block h-6 w-6 bg-black align-baseline"
                    ></span>
                    Front-End Developer & UI/UX Designer
                    <span
                        class="inline-block h-6 w-6 bg-black align-baseline"
                    ></span>
                    Blending <span class="font-thin italic">Code</span> And
                    <span class="font-thin italic">Creativity</span>
                    <span
                        class="inline-block h-6 w-6 bg-black align-baseline"
                    ></span>
                </h1>
            </section>

            <section
                id="frontend"
                class="flex h-screen w-screen flex-shrink-0 snap-start items-center justify-center"
            >
                <h1 class="text-6xl font-bold">Front-end</h1>
            </section>

            <section
                id="uiux"
                class="flex h-screen w-screen flex-shrink-0 snap-start items-center justify-center"
            >
                <h1 class="text-6xl font-bold">UI/UX</h1>
            </section>

            <section
                id="contact"
                class="flex h-screen w-screen flex-shrink-0 snap-start flex-col items-center justify-center space-y-4 text-center"
            >
                <h1 class="text-8xl font-bold">
                    CONTACT ME
                    <span
                        class="inline-block h-6 w-6 bg-black align-baseline"
                    ></span>
                </h1>
                <div class="text-5xl font-thin">
                    <p>Tel: 0720 018 492</p>
                    <p>Email: njnwasike@gmail.com</p>
                    <p>GitHub: nekesa-w</p>
                </div>
            </section>
        </main>

        <script>
            const scroller = document.getElementById("mainContent");
            const layers = document.querySelectorAll(".parallax-layer");
            const plus = document.querySelector(".parallax-plus span");

            document.addEventListener("keydown", (e) => {
                if (e.key === "ArrowRight") {
                    scroller.scrollBy({
                        left: scrollAmount,
                        behavior: "smooth",
                    });
                } else if (e.key === "ArrowLeft") {
                    scroller.scrollBy({
                        left: -scrollAmount,
                        behavior: "smooth",
                    });
                }
            });

            scroller.addEventListener(
                "wheel",
                (e) => {
                    e.preventDefault();
                    scroller.scrollBy({
                        left: e.deltaY,
                        behavior: "smooth",
                    });
                },
                { passive: false },
            );

            scroller.addEventListener("scroll", () => {
                const scrollLeft = scroller.scrollLeft;
                const direction = scrollLeft > lastScrollLeft ? 1 : -1;
                rotation += direction * 5;
                plus.style.transform = `rotate(${rotation}deg)`;
                layers.forEach((layer) => {
                    const speed = parseFloat(layer.dataset.speed) || 0;
                    layer.style.transform = `translateX(-${scrollLeft * speed}px)`;
                });
                lastScrollLeft = scrollLeft;
            });
        </script>
    </body>
</html>
