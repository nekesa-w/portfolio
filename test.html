<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>NW's Portfolio Parallax</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow-x: hidden;
                scroll-behavior: smooth;
            }
            .parallax-layer {
                position: absolute;
                top: 0;
                left: 0;
                height: 100%;
                width: 300%; /* wider than viewport so it scrolls nicely */
                will-change: transform;
            }
            .layer-text {
                font-size: 8rem;
                font-weight: bold;
                opacity: 0.05;
                white-space: nowrap;
            }
            .circle {
                border-radius: 9999px;
                opacity: 0.3;
                filter: blur(100px);
                position: absolute;
            }
        </style>
    </head>

    <body class="font-inter relative overflow-x-hidden bg-white text-zinc-800">
        <!-- 🪞 Parallax Layers -->
        <div
            id="parallax"
            class="pointer-events-none fixed left-0 top-0 h-full w-full overflow-hidden"
        >
            <!-- Layer 1: Gradient background -->
            <div
                class="parallax-layer z-0 bg-gradient-to-r from-pink-200 via-purple-200 to-blue-200"
                data-speed="0.2"
            ></div>

            <!-- Layer 2: Big text -->
            <div
                class="parallax-layer z-10 flex items-center whitespace-nowrap"
                data-speed="0.4"
            >
                <div class="layer-text">
                    NICOLE &nbsp; WASIKE &nbsp; PORTFOLIO &nbsp;
                </div>
            </div>

            <!-- Layer 3: Circles -->
            <div class="parallax-layer z-20" data-speed="0.6">
                <div
                    class="circle left-1/3 top-1/4 h-96 w-96 bg-pink-300"
                ></div>
                <div
                    class="circle left-2/4 top-2/3 h-64 w-64 bg-yellow-200"
                ></div>
                <div
                    class="circle left-2/5 top-1/2 h-80 w-80 bg-blue-300"
                ></div>
            </div>
        </div>

        <!-- 🧭 Main content (horizontal scroll) -->
        <main
            id="mainContent"
            class="relative z-30 mx-auto flex h-screen w-screen snap-x snap-mandatory flex-row overflow-y-hidden overflow-x-scroll"
        >
            <section
                id="home"
                class="flex min-w-full items-center justify-center"
            >
                <h1 class="text-center text-8xl font-black text-black">
                    NICOLE<br />WASIKE
                </h1>
            </section>
            <section
                id="about"
                class="flex min-w-full items-center justify-center"
            >
                <p class="max-w-xl text-center text-4xl">
                    Hello, I'm Nicole — Front-end Developer & UI/UX Designer
                    from Nairobi.
                </p>
            </section>
            <section
                id="cv"
                class="flex min-w-full items-center justify-center"
            >
                <h1 class="text-6xl font-bold">CV</h1>
            </section>
            <section
                id="frontend"
                class="flex min-w-full items-center justify-center"
            >
                <h1 class="text-6xl font-bold">Front-end</h1>
            </section>
            <section
                id="design"
                class="flex min-w-full items-center justify-center"
            >
                <h1 class="text-6xl font-bold">UI/UX</h1>
            </section>
            <section
                id="contact"
                class="flex min-w-full flex-col items-center justify-center space-y-2"
            >
                <h1 class="text-6xl font-bold">Contact</h1>
                <p>Tel: 0720 018 492</p>
                <p>Email: njnwasike@gmail.com</p>
                <p>GitHub: nekesa-w</p>
            </section>
        </main>

        <!-- ⚙ Parallax script -->
        <script>
            const scroller = document.getElementById("mainContent");
            const layers = document.querySelectorAll(".parallax-layer");

            // Make vertical wheel scroll horizontal
            scroller.addEventListener(
                "wheel",
                function (e) {
                    e.preventDefault();
                    scroller.scrollBy({ left: e.deltaY, behavior: "smooth" });
                },
                { passive: false },
            );

            scroller.addEventListener("scroll", () => {
                const scrollLeft = scroller.scrollLeft;
                layers.forEach((layer) => {
                    const speed = layer.dataset.speed;
                    layer.style.transform = `translateX(-${scrollLeft * speed}px)`;
                });
            });
        </script>
    </body>
</html>
